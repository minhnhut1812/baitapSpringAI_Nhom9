<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Cửa hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
 <div th:replace="~{fragments/layout :: alerts}"></div>
 <div class="row">
 <!-- Cột danh mục -->
 <aside class="col-md-3 mb-3">
 <div class="list-group">
 <a class="list-group-item list-group-item-action"
 th:classappend="${categoryId == null} ? 'active'"
th:href="@{/products(keyword=${keyword})}">Tất cả</a>
 <a th:each="c : ${categories}" class="list-group-item list-group-item-action"
 th:classappend="${c.id == categoryId} ? 'active'"
th:href="@{/products(categoryId=${c.id}, keyword=${keyword})}"
th:text="${c.name}"></a>
 </div>
 </aside>
 <!-- Lưới sản phẩm -->
 <section class="col-md-9">
 <p class="text-muted">
 Tìm thấy <b th:text="${products.totalElements}">0</b> sản phẩm
 <span th:if="${keyword}"> cho từ khoá "<b th:text="${keyword}"></b>"</span>
 </p>
 <div class="row row-cols-2 row-cols-lg-3 g-3">
 <div class="col" th:each="p : ${products.content}">
 <div class="card h-100 shadow-sm">
 <a th:href="@{/products/{id}(id=${p.id})}">
 <img class="card-img-top product-img" th:src="${p.imageUrl}"
th:alt="${p.name}">
 </a>
<div class="card-body d-flex flex-column">
 <small class="text-muted" th:text="${p.category.name}"></small>
<h6 class="card-title" th:text="${p.name}"></h6>
<div class="price mb-2" th:text="${#numbers.formatDecimal(p.price, 0,
'POINT', 0, 'COMMA')} + ' ₫'"></div>
 <div class="mt-auto d-flex justify-content-between align-items-center">
 <a class="btn btn-sm btn-outline-primary"
th:href="@{/products/{id}(id=${p.id})}">Chi tiết</a>
 <form th:action="@{/cart/add}" method="post" class="d-inline" sec:authorize="!hasRole('SELLER')">
     <input type="hidden" name="productId" th:value="${p.id}">
     <input type="hidden" name="quantity" value="1">
     <button type="submit" class="btn btn-sm btn-primary" th:disabled="${p.quantity <= 0}" title="Thêm vào giỏ hàng">
         🛒 Bỏ giỏ
     </button>
 </form>
 </div>
 </div>
 </div>
 </div>
 </div>
 <nav class="mt-4" th:if="${products.totalPages > 1}">
 <ul class="pagination justify-content-center">
 <li class="page-item" th:each="i : ${#numbers.sequence(0, products.totalPages -
1)}"
 th:classappend="${i == products.number} ? 'active'">
<a class="page-link" th:href="@{/products(keyword=${keyword},
categoryId=${categoryId}, page=${i})}"
 th:text="${i + 1}"></a>
 </li>
 </ul>
 </nav>
 </section>
 </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
