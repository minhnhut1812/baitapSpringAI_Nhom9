<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
 <div th:replace="~{fragments/layout :: alerts}"></div>
 <div class="row g-4">
 <div class="col-md-5"><img class="img-fluid rounded border w-100" th:src="${product.imageUrl}"
th:alt="${product.name}"></div>
 <div class="col-md-7">
 <small class="text-muted" th:text="${product.category.name}"></small>
 <h3 th:text="${product.name}"></h3>
 <h4 class="price mb-3" th:text="${#numbers.formatDecimal(product.price, 0, 'POINT', 0,
'COMMA')} + ' ₫'"></h4>
 <p th:text="${product.description}"></p>
 <p>Tình trạng: 
     <span th:if="${product.quantity > 0}" class="badge bg-success">Còn lại: <b th:text="${product.quantity}"></b> sản phẩm</span>
     <span th:if="${product.quantity <= 0}" class="badge bg-danger">Tạm hết hàng</span>
 </p>

 <!-- Form Thêm vào giỏ hàng (chỉ hiển thị với CUSTOMER và GUEST, ẩn với SELLER) -->
 <div class="my-4" sec:authorize="!hasRole('SELLER')">
     <form th:action="@{/cart/add}" method="post" class="d-flex align-items-center gap-3">
         <input type="hidden" name="productId" th:value="${product.id}">
         <div class="input-group" style="width: 140px;">
             <span class="input-group-text">SL</span>
             <input type="number" name="quantity" class="form-control" value="1" min="1" th:max="${product.quantity}" th:disabled="${product.quantity <= 0}">
         </div>
         <button type="submit" class="btn btn-primary btn-lg" th:disabled="${product.quantity <= 0}">
             🛒 Thêm vào giỏ hàng
         </button>
     </form>
 </div>

 <a class="btn btn-link px-0" th:href="@{/products}">← Tiếp tục xem hàng</a>
 </div>
 </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
