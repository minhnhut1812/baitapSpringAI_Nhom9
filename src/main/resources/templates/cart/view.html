<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giỏ hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
 <div th:replace="~{fragments/layout :: alerts}"></div>
 <h3>Giỏ hàng</h3>
 <div th:if="${cart.empty}" class="alert alert-info">
 Giỏ hàng trống. <a th:href="@{/products}">Mua sắm ngay</a>
 </div>
 <div th:unless="${cart.empty}">
 <table class="table align-middle">
 <thead><tr><th>Sản phẩm</th><th class="text-end">Đơn giá</th><th style="width:170px">Số
lượng</th><th class="text-end">Thành tiền</th><th></th></tr></thead>
 <tbody>
 <tr th:each="i : ${cart.items}">
 <td><img class="thumb rounded me-2" th:src="${i.imageUrl}" alt=""><span
th:text="${i.name}"></span></td>
 <td class="text-end" th:text="${#numbers.formatDecimal(i.price, 0, 'POINT', 0,
'COMMA')} + ' ₫'"></td>
 <td>
 <form th:action="@{/cart/update}" method="post" class="d-flex gap-1">
 <input type="hidden" name="productId" th:value="${i.productId}">
<input type="number" name="quantity" min="0" class="form-control formcontrol-sm" th:value="${i.quantity}">
 <button class="btn btn-sm btn-outline-secondary">Cập nhật</button>
 </form>
 </td>
 <td class="text-end" th:text="${#numbers.formatDecimal(i.subtotal, 0, 'POINT', 0,
'COMMA')} + ' ₫'"></td>
 <td>
 <form th:action="@{/cart/remove/{id}(id=${i.productId})}" method="post">
 <button class="btn btn-sm btn-outline-danger">✕</button>
 </form>
 </td>
 </tr>
 </tbody>
 <tfoot>
 <tr><th colspan="3" class="text-end">Tổng cộng (<span
th:text="${cart.totalQuantity}"></span> sản phẩm)</th>
 <th class="text-end price" th:text="${#numbers.formatDecimal(cart.totalAmount, 0,
'POINT', 0, 'COMMA')} + ' ₫'"></th><th></th></tr>
 </tfoot>
 </table>
 <div class="d-flex justify-content-between">
 <form th:action="@{/cart/clear}" method="post"><button class="btn btn-outlinedanger">Xoá giỏ hàng</button></form>
 <div>
 <a class="btn btn-secondary" th:href="@{/products}">Tiếp tục mua</a>
 <a class="btn btn-success" th:href="@{/checkout}">Thanh toán →</a>
 </div>
 </div>
 </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
