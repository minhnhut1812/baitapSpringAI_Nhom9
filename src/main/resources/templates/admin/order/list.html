<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý đơn hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h3>Đơn hàng</h3>
    <table class="table table-bordered table-hover align-middle">
        <thead class="table-light"><tr><th>#</th><th>Ngày</th><th>Khách</th><th>SĐT</th><th>Thanh toán</th><th>Trạng thái</th><th class="text-end">Tổng</th><th></th></tr></thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>
            <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${o.customerName}"></td>
            <td th:text="${o.phone}"></td>
            <td th:text="${o.paymentMethod}"></td>
            <td><span class="badge bg-secondary" th:text="${o.status}"></span></td>
            <td class="text-end" th:text="${#numbers.formatDecimal(o.totalAmount, 0, 'POINT', 0, 'COMMA')}"></td>
            <td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/orders/{id}(id=${o.id})}">Xem</a></td>
        </tr>
        </tbody>
    </table>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
