<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Chi tiết đơn')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>
<main class="container">
 <div th:replace="~{fragments/layout :: alerts}"></div>
 <h3>Đơn #<span th:text="${order.id}"></span></h3>
 <p>Khách: <b th:text="${order.customerName}"></b> – <span th:text="${order.phone}"></span> –
<span th:text="${order.address}"></span><br>
 Ghi chú: <span th:text="${order.note}"></span></p>
 <table class="table">
 <thead><tr><th>Sản phẩm</th><th class="text-end">Đơn giá</th><th class="textend">SL</th><th class="text-end">Thành tiền</th></tr></thead>
 <tbody><tr th:each="d : ${order.details}">
 <td th:text="${d.product.name}"></td>
 <td class="text-end" th:text="${#numbers.formatDecimal(d.unitPrice, 0, 'POINT', 0,
'COMMA')}"></td>
 <td class="text-end" th:text="${d.quantity}"></td>
 <td class="text-end" th:text="${#numbers.formatDecimal(d.subtotal, 0, 'POINT', 0,
'COMMA')}"></td>
 </tr></tbody>
 <tfoot><tr><th colspan="3" class="text-end">Tổng</th>
 <th class="text-end" th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'POINT',
0, 'COMMA')} + ' ₫'"></th></tr></tfoot>
 </table>
 <form th:action="@{/admin/orders/{id}/status(id=${order.id})}" method="post" class="d-flex gap-
2 mb-3">
 <select name="status" class="form-select w-auto">
 <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}" th:selected="${s ==
order.status}"></option>
 </select>
 <button class="btn btn-primary">Cập nhật trạng thái</button>
 </form>
 <form th:action="@{/admin/orders/{id}/delete(id=${order.id})}" method="post" onsubmit="return
confirm('Xoá đơn này?')">
 <button class="btn btn-outline-danger">Xoá đơn</button>
 <a class="btn btn-secondary" th:href="@{/admin/orders}">← Danh sách</a>
 </form>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
