spring.application.name=eshop
server.port=8080
# ===== MariaDB =====
spring.datasource.url=jdbc:mariadb://localhost:3306/eshop
spring.datasource.username=root
# Doi mat khau theo may cua ban
spring.datasource.password=root
# ===== JPA / Hibernate =====
# Bang da duoc tao bang eShop.sql nen khong cho Hibernate tao/sua bang
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Cho phep Thymeleaf doc quan he LAZY (vd: product.category.name)
spring.jpa.open-in-view=true
# ===== Thymeleaf =====
spring.thymeleaf.cache=false
# ===== JWT =====
# Khoa bi mat Base64, toi thieu 256 bit (32 byte)
app.jwt.secret=N45bb7tsq8gOEJgSwlOh2QJ88qa66XO66l2+9pGjnM/YI0zwef4ob8hrFuifheOM
# Thoi han token: 1 ngay
app.jwt.expiration-ms=86400000

logging.level.org.springframework.security=DEBUG